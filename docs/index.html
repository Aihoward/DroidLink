<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DroidLink Downloads</title>
  <meta name="description" content="Download the latest DroidLink APK and view previous releases." />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at top, #17305c 0, #0b1220 38%, #070b12 100%); color: #f7f9fc; }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 72px 0; }
    .card { background: rgba(14, 22, 38, .84); border: 1px solid rgba(255,255,255,.10); border-radius: 26px; padding: 32px; box-shadow: 0 24px 80px rgba(0,0,0,.35); backdrop-filter: blur(14px); }
    .badge { display: inline-block; padding: 7px 11px; border-radius: 999px; background: rgba(93, 156, 255, .14); border: 1px solid rgba(123, 176, 255, .28); color: #b9d5ff; font-size: 13px; font-weight: 700; }
    h1 { font-size: clamp(42px, 9vw, 72px); line-height: .95; margin: 18px 0 14px; letter-spacing: -3px; }
    .lead { color: #aebbd0; line-height: 1.7; font-size: 17px; margin-bottom: 28px; }
    .version { margin: 22px 0 10px; font-size: 14px; color: #8da0bc; }
    .version strong { color: #fff; font-size: 18px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
    a.button { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 20px; border-radius: 14px; font-weight: 800; }
    .primary { background: #f7f9fc; color: #0a1020; }
    .secondary { border: 1px solid rgba(255,255,255,.15); color: #f7f9fc; background: rgba(255,255,255,.04); }
    .status { margin-top: 16px; font-size: 14px; color: #91a1b9; }
    footer { text-align: center; color: #67758a; margin-top: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <span class="badge">Android • Beta</span>
      <h1>DroidLink</h1>
      <p class="lead">Android-to-Android remote screen streaming built for low-latency connections. Download the newest APK or jump to the full release history.</p>
      <div class="version">Latest release: <strong id="version">Checking…</strong></div>
      <div class="actions">
        <a id="download" class="button primary" href="https://github.com/Aihoward/DroidLink/releases" aria-disabled="true">Download latest APK</a>
        <a class="button secondary" href="https://github.com/Aihoward/DroidLink/releases">All versions</a>
      </div>
      <div id="status" class="status">Looking for the newest GitHub release…</div>
    </section>
    <footer>Official DroidLink downloads</footer>
  </main>

  <script>
    const api = 'https://api.github.com/repos/Aihoward/DroidLink/releases/latest';
    fetch(api, { headers: { 'Accept': 'application/vnd.github+json' } })
      .then(r => { if (!r.ok) throw new Error('No release yet'); return r.json(); })
      .then(release => {
        document.getElementById('version').textContent = release.tag_name || release.name || 'Latest';
        const apk = (release.assets || []).find(a => a.name.toLowerCase().endsWith('.apk'));
        const button = document.getElementById('download');
        const status = document.getElementById('status');
        if (apk) {
          button.href = apk.browser_download_url;
          button.removeAttribute('aria-disabled');
          status.textContent = apk.name;
        } else {
          button.href = release.html_url;
          status.textContent = 'Release found, but no APK asset is attached yet.';
        }
      })
      .catch(() => {
        document.getElementById('version').textContent = 'No release yet';
        document.getElementById('status').textContent = 'Your first APK release will appear here automatically.';
      });
  </script>
</body>
</html>
