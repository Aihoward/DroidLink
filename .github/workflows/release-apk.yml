name: Verify DroidLink tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and verify reproducible debug build
        run: ./gradlew test assembleDebug

      # Stable APKs are intentionally signed and published outside this job.
      # GitHub-hosted runners otherwise generate a different debug signing key
      # for every release, preventing users from installing updates in place.
